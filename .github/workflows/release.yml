name: 'release'

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
            uploadPlainBinary: false
          - platform: 'windows-latest'
            args: '--no-bundle'
            uploadPlainBinary: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install # change this to npm or pnpm depending on which one you use.

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLOUD_API_BASE_URL: ${{ vars.VITE_CLOUD_API_BASE_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Rivals II Tag Tool v__VERSION__'
          releaseBody: |
            Download for your platform below.

            - **Windows**: download the `.exe` and run it. No installer needed.
            - **Mac**: download the `.dmg`, open it, and drag the app to Applications.
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          releaseAssetNamePattern: 'Rivals-II-Tag-Tool_[version]_[platform]_[arch][ext]'
          args: ${{ matrix.args }}

      # Certificates are valid ~3 days, so the RFC3161 timestamp is mandatory.
      - name: sign the Windows binary
        if: matrix.platform == 'windows-latest'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: hyperflame-codesign
          certificate-profile-name: rivals-2-tag-tool
          files: ${{ github.workspace }}\src-tauri\target\release\rivals-2-tag-tool.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: replace the release asset with the signed build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $exe = 'src-tauri\target\release\rivals-2-tag-tool.exe'
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          # Fail rather than ship an unsigned or untimestamped exe.
          & $signtool verify /pa /v $exe

          # Must match what releaseAssetNamePattern produced, or this adds a
          # second asset instead of replacing the unsigned one.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item $exe "Rivals-II-Tag-Tool_${version}_windows_x64.exe"
          gh release upload $env:TAG "Rivals-II-Tag-Tool_${version}_windows_x64.exe" --clobber

      # The file the app checks to find out an update exists. This has to run
      # after signing, because the checksum below must match the exe people
      # actually download. Each platform writes its own file — Windows and macOS
      # build at the same time, so sharing one would have them overwrite it.
      - name: publish the Windows update manifest
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = "Rivals-II-Tag-Tool_${version}_windows_x64.exe"
          $sha256 = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()

          # Careful: the file is named "x86_64" but the exe inside it is named
          # "x64". Both are correct — the app looks for the first spelling, and
          # tauri-action produces the second. Don't make them match.
          $manifest = [ordered]@{
            version = $version
            url     = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/${env:TAG}/${asset}"
            sha256  = $sha256
            pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $manifest | ConvertTo-Json | Set-Content 'latest-windows-x86_64.json' -Encoding utf8

          gh release upload $env:TAG 'latest-windows-x86_64.json' --clobber

      # The Mac app only tells users an update exists, it doesn't install one.
      # It still writes the same fields so both platforms share a format. The
      # .dmg on disk has a different name than the uploaded copy, so search for
      # it rather than guessing.
      - name: publish the macOS update manifest
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          dmg=$(find src-tauri/target -name '*.dmg' | sort | sed -n '1p')
          if [ -z "$dmg" ]; then
            echo "no .dmg found under src-tauri/target" >&2
            exit 1
          fi

          asset="Rivals-II-Tag-Tool_${version}_darwin_aarch64.dmg"
          sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)

          cat > latest-darwin-aarch64.json <<EOF
          {
            "version": "${version}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}",
            "sha256": "${sha256}",
            "pubDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          gh release upload "$TAG" latest-darwin-aarch64.json --clobber
