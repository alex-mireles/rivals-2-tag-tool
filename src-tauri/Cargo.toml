[package]
name = "rivals-2-tag-tool"
version = "2.1.1"
description = "Export, share, and import Rivals of Aether II tags & custom controls"
authors = ["Alex Mireles (HyperFlame)"]
edition = "2021"
repository = "https://github.com/alex-mireles/rivals-2-tag-tool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rivals_2_tag_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uesave = "0.7.1"
tauri-plugin-dialog = "2"
base64 = "0.22"
# rust_backend is spelled out because `zip` declares flate2 with default-features
# off and relies on the parent crate to select a backend.
flate2 = { version = "1", features = ["rust_backend"] }
# Only for `buffer_unordered`, which bounds how many tag downloads run at once.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
url = "2"
# Default features pull bzip2/lzma/zstd/xz/aes (all C). `deflate` is the only
# codec we need and the only pure-Rust way to link flate2 here: the narrower
# `deflate-flate2` gates the code without enabling zip's optional flate2 dep,
# and the `deflate-zlib*` variants are C. It also brings zopfli, which is pure
# Rust. Pinned to a minor because 3.x/4.x bump the MSRV and rename features.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
